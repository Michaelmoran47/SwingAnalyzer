[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swing-analyzer"
version = "0.1.0"
description = "Golf swing analysis from phone video: pose estimation, phase detection, and metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Legacy `mp.solutions.pose` API (dropped in newer releases). The lite/full
# models ship in the wheel; the heavy model (complexity 2, our default) is
# downloaded by MediaPipe on first use.
mediapipe = ["mediapipe==0.10.21"]
# CPU runtime. For an NVIDIA GPU install onnxruntime-gpu instead of onnxruntime.
rtmpose = ["rtmlib>=0.0.13", "onnxruntime>=1.16"]
# streamlit is pinned: newer releases need protobuf>=5.26, which breaks mediapipe 0.10.21 (protobuf<5).
demo = ["streamlit==1.40.2", "protobuf>=4.25.3,<5", "matplotlib>=3.7"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
swing = "swing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
